services:
  - type: web
    name: ecommerce-backend
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: node index.js
    rootDirectory: server
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
